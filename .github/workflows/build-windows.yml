name: Build Windows EXE

on:
  push:
    branches: [main]
    paths:
      - '**.py'
      - 'templates/**'
      - 'requirements.txt'
      - 'ppttovideo.spec'
      - '.github/workflows/build-windows.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Windows 打包
    runs-on: windows-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pywebview pyinstaller

      - name: PyInstaller 打包
        run: pyinstaller ppttovideo.spec --noconfirm

      - name: 压缩为 zip
        shell: pwsh
        run: Compress-Archive -Path dist\PPTtoVideo -DestinationPath PPTtoVideo-Windows.zip -Force

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: PPTtoVideo-Windows
          path: PPTtoVideo-Windows.zip
          retention-days: 30

      - name: 发布到 Release
        uses: ncipollo/release-action@v1
        with:
          tag: windows-build
          name: PPTtoVideo Windows 版（最新自动构建）
          body: |
            此版本由 GitHub Actions 自动打包（包含最新代码与依赖修复）。
            使用方式：下载 PPTtoVideo-Windows.zip，解压后运行 PPTtoVideo.exe。
            首次运行如弹出 Windows SmartScreen 蓝色提示，点击「更多信息」→「仍要运行」即可。
          artifacts: PPTtoVideo-Windows.zip
          allowUpdates: true
          replacesArtifacts: true
          makeLatest: true
